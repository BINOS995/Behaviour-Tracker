<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 400px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            margin: 0.5rem;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .success {
            background: #2196F3;
        }
        .info {
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Cache Management</h1>
        <p>Clear your browser cache and local storage to see the latest changes.</p>
        
        <button onclick="clearLocalStorage()">Clear Local Storage</button>
        <button onclick="clearAllCache()" class="success">Clear All Cache</button>
        <button onclick="location.reload()">Refresh Page</button>
        
        <div class="info">
            <p>After clearing, visit the <a href="index.html?v=7" style="color: #FFD700;">login page</a> to test the welcome modal.</p>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.innerHTML = `<p style="margin-top: 1rem; padding: 0.5rem; background: ${isError ? '#f44336' : '#4CAF50'}; border-radius: 0.25rem;">${message}</p>`;
            setTimeout(() => {
                status.innerHTML = '';
            }, 3000);
        }

        function clearLocalStorage() {
            try {
                localStorage.clear();
                sessionStorage.clear();
                showStatus('✅ Local storage cleared successfully!');
                console.log('Local storage cleared');
            } catch (error) {
                showStatus('❌ Error clearing local storage: ' + error.message, true);
                console.error('Error clearing local storage:', error);
            }
        }

        async function clearAllCache() {
            try {
                // Clear local storage
                localStorage.clear();
                sessionStorage.clear();
                
                // Clear service worker cache
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(cacheName => caches.delete(cacheName)));
                    console.log('Service worker caches cleared:', cacheNames);
                }
                
                // Unregister service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map(registration => registration.unregister()));
                    console.log('Service workers unregistered:', registrations.length);
                }
                
                showStatus('✅ All cache cleared! Redirecting to login...');
                
                // Redirect to login after a short delay
                setTimeout(() => {
                    window.location.href = 'index.html?v=7';
                }, 1500);
                
            } catch (error) {
                showStatus('❌ Error clearing cache: ' + error.message, true);
                console.error('Error clearing cache:', error);
            }
        }

        // Auto-clear localStorage on page load for testing
        window.addEventListener('load', function() {
            console.log('Cache management page loaded');
        });
    </script>
</body>
</html>
